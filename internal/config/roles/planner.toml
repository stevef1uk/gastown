# Planner role definition
# Spec-to-task breakdown agent. One per rig.

role = "planner"
scope = "rig"
nudge = "Check for SPEC breakdown requests or planning assignments, then execute."
prompt_template = "planner.md.tmpl"

[session]
pattern = "{prefix}-{rig}-{name}"
work_dir = "{town}/{rig}/planner"
needs_pre_sync = false
start_command = "gt-agent"

[env]
GT_ROLE = "{rig}/planner"
GT_SCOPE = "rig"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
