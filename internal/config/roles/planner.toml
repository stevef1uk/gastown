# Planner role definition
# Spec-to-task breakdown agent. One per town.

role = "planner"
scope = "town"
nudge = "Check for SPEC breakdown requests or planning assignments, then execute."
prompt_template = "planner.md.tmpl"

[session]
pattern = "hq-planner"
work_dir = "{town}/planner"
needs_pre_sync = false
start_command = "gt-agent"

[env]
GT_ROLE = "planner"
GT_SCOPE = "town"

[health]
ping_timeout = "30s"
consecutive_failures = 3
kill_cooldown = "5m"
stuck_threshold = "1h"
