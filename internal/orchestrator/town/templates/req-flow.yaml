id: req-flow
description: Requirements-driven workflow (Analyst -> QA spec review -> Architect -> Planner -> Polecat -> QA)
initial_state: kickoff
# Same guards as rig-flow — profile overrides per-rig via workflow-profile.json
validation:
  bead_title_contains: "Implement "
  min_architecture_bytes: 200
  min_plan_bytes: 200
states:
  kickoff:
    role: mayor
    prompt_file: prompts/req-flow/kickoff.md
    instructions: |
      1. Ensure rig '{{rig}}' is registered and `{{rig}}/mayor/rig/REQUIREMENTS.md` exists.
      2. Report outcome success when ready for analysis.
    hooks:
      retry_hint: |
        One CMD: per line. Confirm the rig is registered and REQUIREMENTS.md exists before reporting success.
    transitions:
      success:
        to: analysis
      failure:
        to: kickoff
  analysis:
    role: analyst
    prompt_file: prompts/req-flow/analysis.md
    instructions: |
      1. Read `{{rig}}/mayor/rig/REQUIREMENTS.md` completely.
      2. Write `{{rig}}/mayor/rig/SPEC.md` — a complete, buildable technical specification that:
         - Preserves EVERY requirement from REQUIREMENTS.md (nothing dropped).
         - Fills in technical details the business requirements omit: data models, API contracts,
           error handling, testing strategy, directory layout, seed data, non-functional requirements.
         - Is structured so the Architect, Planner, and Polecat can build from it without ambiguity.
      3. Verify SPEC.md exists and meets minimum size before reporting success.
    hooks:
      max_cmd_turns: 15
      cmd_guard: analysis
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc]
      track: analysis
      artifacts: analysis
      retry_hint: |
        One CMD: per line. Read REQUIREMENTS.md with `head -n 80 {{rig}}/mayor/rig/REQUIREMENTS.md`, then write SPEC.md via heredoc. Verify with `wc -c {{rig}}/mayor/rig/SPEC.md`.
      failure_hint: |
        Write SPEC.md with a heredoc CMD in this session. Read REQUIREMENTS.md fully first.
        SPEC.md must contain: Overview, Technical Stack, Data Model, API/HTTP Routes, Frontend,
        File Layout, Phases with Success Criteria, Testing Strategy, Seed Data, and Non-Functional Requirements.
        After a successful heredoc write and `wc -c` meeting the minimum, report success.
    transitions:
      success:
        to: spec_review
      failure:
        to: analysis
  spec_review:
    role: qa
    prompt_file: prompts/req-flow/spec_review.md
    instructions: |
      1. Read both `{{rig}}/mayor/rig/REQUIREMENTS.md` and `{{rig}}/mayor/rig/SPEC.md`.
      2. Verify EVERY requirement from REQUIREMENTS.md is covered in SPEC.md — no omissions.
      3. Verify SPEC.md is complete enough for an Architect to design from: data models, API contracts,
         file layout, phases, testing strategy, seed data, and non-functional requirements.
      4. Report success only when nothing is missing. Report failure with a specific list of gaps.
    hooks:
      max_cmd_turns: 8
      cmd_guard: spec_review
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc]
      track: spec_review
      artifacts: spec_review
      retry_hint: |
        One CMD: per line. diff the requirements checklist against SPEC sections. Report gaps in summary.
      failure_hint: |
        Read both files: `head -n 80 {{rig}}/mayor/rig/REQUIREMENTS.md` and `head -n 80 {{rig}}/mayor/rig/SPEC.md`.
        List every missing requirement in your failure summary. The Analyst will fix SPEC.md.
    transitions:
      success:
        to: design
      failure:
        to: analysis
  design:
    role: architect
    prompt_file: prompts/rig-flow/design.md
    instructions: |
      1. Read `{{town_root}}/{{rig}}/mayor/rig/SPEC.md`.
      2. Write `{{town_root}}/{{rig}}/mayor/rig/architecture.md` (>= {{min_architecture_bytes}} bytes).
      3. CRITICAL: You MUST prefix ALL file paths (in lists, prose, tables, and code blocks) with the root directory name from the SPEC (e.g. `layout_root/cmd/server/main.go`, not `cmd/server/main.go`, and `layout_root/web/` not `web/`).
    hooks:
      prompt_context: [design_draft_context]
      pre_run: [reset_layout_pre_implementation, prune_rig_root_junk]
      max_cmd_turns: 12
      cmd_guard: design
      cmd_rewrites: [rig_placeholders, spec_md_case, unwrap_bash_lc]
      track: design
      artifacts: design
      retry_hint: |
        One CMD: per line. Read SPEC with head; write architecture.md via a single-quoted heredoc (>=200 bytes).
        Prose may mention python3 or backend/ paths — that is fine inside the document.
        After a successful heredoc write and `wc -c` meeting the minimum, gt-agent auto-completes design when validation passes (JSON success optional).
      failure_hint: |
        Write architecture.md with a heredoc CMD in this session (stale files from prior runs do not count). Read SPEC with head -n 60. HTTP paths and store symbols must match SPEC verbatim (gt-agent rejects /web/* vs /static/, ListLinks vs List, etc.). Prefix **implement file paths** in lists/tables with layout_root (e.g. linkshelf/internal/store/store.go); prose may say store.List or schema.InitSchema without the prefix. If validation fails on file paths, rewrite architecture.md via heredoc. After wc -c passes, the step may auto-complete — or send JSON success only (no CMD lines).
    transitions:
      success:
        to: planning
      failure:
        to: design
  planning:
    role: planner
    prompt_file: prompts/rig-flow/planning.md
    instructions: |
      1. Read SPEC and architecture under `{{rig}}/mayor/rig/`.
      2. Create implementation beads and `plan.md` (>= {{min_plan_bytes}} bytes) with a ## Bead map: real IDs from bd list, full paths, scope + acceptance per file.
    hooks:
      prompt_context: [planning_bead_bootstrap]
      pre_run: [sync_planning_artifacts]
      state_timeout_seconds: 1800
      on_timeout: [sync_planning_on_timeout]
      max_cmd_turns: 20
      empty_response_suffix: "Reply with CMD: lines. Run: CMD: cd {{rig}}/mayor/rig && bd list --status=open && wc -c plan.md. If beads exist and plan.md >= {{min_plan_bytes}} bytes, send {\"outcome\":\"success\",\"summary\":\"beads and plan.md ready\"}. Otherwise bd create missing beads."
      cmd_guard: planning
      cmd_rewrites: [rig_placeholders, spec_md_case, plan_md_after_cd, plan_md_wc_dir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: planning
      artifacts: planning
      post_artifact_success: [sync_planning_artifacts]
      retry_hint: |
        One CMD: per line. After `cd {{rig}}/mayor/rig`, write plan.md with a relative path (not {{rig}}/mayor/rig/plan.md).
        Heredoc must end with a line containing only EOF. Verify with `wc -c {{rig}}/mayor/rig/plan.md` (full path from town root).
      failure_hint: |
        Do not send success JSON until CMD: lines ran in this session. If sync_planning_artifacts already created beads, bd list only — gt-agent rejects bd create when required_files are covered. Do **not** heredoc plan.md when required_files use {{layout_root}}/internal/ or {{layout_root}}/cmd/ — sync builds plan.md with full paths. Run `cd {{rig}}/mayor/rig && wc -c plan.md` (>= {{min_plan_bytes}} bytes; use full path `wc -c {{rig}}/mayor/rig/plan.md` from town root if no cd). Work from {{rig}}/mayor/rig — the environment already has BEADS_DIR set to the rig's beads database.
    transitions:
      success:
        to: plan_review
      failure:
        to: planning
      timeout:
        to: planning
  plan_review:
    role: qa
    prompt_file: prompts/rig-flow/plan_review.md
    instructions: |
      1. Verify open implementation beads match architecture.md and workflow required_files.
      2. Reject duplicate or path-less beads; send planner back to fix.
      3. Reject when SPEC.md, architecture.md, and plan.md disagree on HTTP routes, store API names, module path, or integration contract (gt-agent enforces on success).
    hooks:
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue]
      max_cmd_turns: 8
      cmd_guard: plan_review
      cmd_rewrites: [rig_placeholders, spec_md_case, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: plan_review
      artifacts: plan_review
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Run bd list --status=open,in_progress from {{rig}}/mayor/rig; compare titles to active-phase required_files ({{required_files}}).
      failure_hint: |
        Run `bd list --status=open,in_progress` from {{rig}}/mayor/rig with BEADS_DIR set. Count implement beads for **this phase only** ({{required_files}}). {{integration_contract_scope_note}} Use outcome failure for duplicate/missing beads or plan drift — not for integration contract when the active phase has no cmd/.../main.go.
    transitions:
      success:
        to: project_setup
      failure:
        to: planning
  project_setup:
    role: setup
    prompt_file: prompts/rig-flow/project_setup.md
    instructions: |
      Use only the **{{project_setup_stack_kind}}** stack for this rig (see injected block below).
      Run `{{project_setup_verify_hint}}` green. Beads and plan.md are synced from required_files on pre_run — do not `bd create` unless sync left gaps. Then JSON success.
    hooks:
      prompt_context: [project_setup_stack]
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue, prune_rig_root_junk, ensure_test_stack_ready]
      cmd_guard: project_setup
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit]
      env:
        beads_dir: true
        python_venv: create
      pip_repair_before_run: true
      python3_rewrite: true
      track: project_setup
      auto_verify_ok_clears_cmd_failure: true
      post_artifact_success: [sync_planning_artifacts, ensure_http_implementation_config, close_project_setup_beads]
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: pip_install
          verify: python_setup
        - when: python_venv
          verify: python_setup
        - when: npm_install
          verify: node_setup
        - when: yarn_install
          verify: node_setup
        - when: pnpm_install
          verify: node_setup
      artifacts: project_setup
      retry_hint_key: project_setup
      failure_hint: |
        {{project_setup_failure_hint}} Duplicate implement beads are auto-deleted on pre_run — do not bd create more.
    transitions:
      success:
        to: implementation
      failure:
        to: project_setup
  implementation:
    role: polecat
    prompt_file: prompts/rig-flow/implementation.md
    instructions: |
      Implement the **Next bead** only: in_progress -> code + unit tests tied to SPEC/plan acceptance -> verify (go test / pytest per Next bead) -> bd close. JSON success when all implement beads are closed.
    hooks:
      state_timeout_seconds: 7200
      on_timeout: [recover_implementation_stall]
      on_state_timeout: [recover_implementation_stall]
      cmd_timeout_seconds: 30
      max_cmd_turns: 100
      omit_orchestrator_context: true
      system_prompt_footer: |
        **Target platform: {{target_os}}/{{target_arch}}** — use Unix paths only. Do NOT use Windows paths (C:\) or macOS-only conventions.
        Prefer READ:/EDIT:/WRITE: for source and test files; `CMD: <shell>` for bd and Verify only. Add/update unit tests from plan.md acceptance before bd close. JSON success in a later message (not with CMD or native tools).

        ## Required format (follow exactly — no JSON wrappers, no markdown fences)

        **New file:**
        WRITE: {{layout_root}}/path/file.go
        package pkg

        func main() {
        }
        ---END WRITE---

        **Edit existing file:**
        EDIT: {{layout_root}}/path/file.go
        <<<<<<< SEARCH
        old code
        =======
        new code
        >>>>>>> REPLACE

        **Shell commands (one per line):**
        CMD: cd {{rig}}/mayor/rig && bd update BEAD_ID --status=in_progress
        CMD: cd {{rig}}/mayor/rig/{{layout_root}} && go test -count=1 ./...

        **Close bead after verify passes:**
        CMD: cd {{rig}}/mayor/rig && bd close BEAD_ID

        **Do NOT wrap CMD in angle brackets** — use plain `CMD: ...` not `<CMD: ...>`.

        **Frontend beads (JS/CSS/HTML):** No verify step needed. Write the file, then `bd close` immediately. Do not run compileall/pytest/go test on web assets.

        **SQL beads (.sql):** Validate with the sqlite3 verify command shown in the Next bead line. Do NOT run pytest on .sql files.

        **One bead at a time:** Update ONE bead to in_progress -> WRITE/EDIT that file -> `bd close`. Do not batch multiple beads.

        **Result (SEPARATE message, NO CMD/WRITE/EDIT lines):**
        {"outcome":"success","summary":"Implemented handlers.go and tests; go test passes"}

        **When verify fails:** First READ the failing file and the dependencies it calls. Then explain the failure in ONE sentence, then apply the fix with EDIT:/WRITE:. Do not try random edits — diagnose from the error output.

        **Web frontend (app.js, index.html):** Use plain JavaScript — no ES module imports/exports (browsers cannot load them without a bundler). Use `fetch()` + DOM APIs. No server-side function calls (InitSchema, DB.Exec) in frontend code. Match DOM IDs between index.html and app.js exactly.
      user_prompt_wrapper: none
      failure_prompt_context: [implementation_queue, implement_bead_context, phase_test_guards]
      empty_response_suffix: "Reply with EDIT:/WRITE:/READ: or CMD: lines. Implement code and unit tests per plan.md; WRITE for new *_test.go or tests/test_*.py. Use Verify from Next bead."
      prompt_context: [implementation_queue, implement_bead_context, phase_test_guards]
      pre_run: [prune_rig_root_junk, ensure_dolt_auto_commit, ensure_dolt_schema_health, sync_planning_artifacts, ensure_http_implementation_config, ensure_handler_phase_prerequisites, ensure_implement_smoke_ready, ensure_go_mod_from_spec, enforce_implement_bead_queue, prune_stale_layout_files, repair_requirements, refresh_codeindex, reconcile_implement_beads, ensure_test_stack_ready]
      per_turn: [prune_stale_layout_files, repair_requirements]
      cmd_guard: implementation
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, backend_path_after_cd, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: implementation
      append_go_compile_context: true
      native_edit_tools: true
      empty_bd_list_ok: true
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: go_write_layout
          verify: go_implementation
        - when: python_test
          verify: python_implementation
        - when: python_import_check
          verify: python_implementation
        - when: python_compileall
          verify: python_implementation
      artifacts: implementation
      retry_hint_key: implementation
      failure_hint: |
        One bead at a time: bd update -> **EDIT:** / **WRITE:** (include *_test.go or tests/test_*.py mapped to SPEC/plan) -> verify from Next bead (go test / pytest) -> bd close. Use CMD only for bd/verify. go run/curl only on cmd/server/main.go bead.
        After QA failure rework: READ the QA-cited file on disk first. If the file already exists and verify passes, bd close it — do NOT rewrite files that QA falsely claimed as missing/broken. Only make changes when QA's claim is confirmed.
    transitions:
      success:
        to: qa_review
      failure:
        to: implementation
      timeout:
        to: implementation
  qa_review:
    role: qa
    prompt_file: prompts/rig-flow/qa_review.md
    instructions: |
      1. Review closed implementation beads in `{{rig}}` against SPEC.md and architecture.md (static `src`/`href` in web/index.html must match the architecture HTTP table — {{static_url_contract_short}}).
      2. Runtime smoke only when SPEC/architecture define HTTP routes or static web+server (see qa_runtime_smoke_block). Skip go run/curl for library-only or API-less profiles. Python rigs use pytest from layout_root/backend — not Go cmd/server paths.
      3. Use outcome task_passed (more work), all_passed (done), or failure (rework).
    hooks:
      state_timeout_seconds: 1800
      cmd_timeout_seconds: 30
      append_go_compile_context: true
      max_cmd_turns: 8
      pre_run: [ensure_dolt_auto_commit, ensure_dolt_schema_health, reconcile_implement_beads]
      per_turn: [repair_requirements]
      cmd_guard: qa
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: qa
      artifacts: qa
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Review closed beads against SPEC and architecture; use allowed QA outcomes only.
      failure_hint: |
        Run real CMD: lines: bd list --status=closed, head SPEC.md, {{unittest_command_hint}} from {{rig}}/mayor/rig. Web+server rigs: `go run ./cmd/server` (gt-agent adds curls from architecture + index.html — do not sed HTML to guess static URLs). If smoke or verify fails, do **not** repeat the same go run+curl — reply next turn with JSON only: {"outcome":"failure","summary":"..."} naming HTTP status, routes, and bd bead IDs from list output.
    transitions:
      task_passed:
        to: implementation
      all_passed:
        to: advance_phase
      failure:
        to: implementation
      architecture_failure:
        to: design
      timeout:
        to: implementation
  advance_phase:
    role: ""
    prompt_file: ""
    instructions: "Internal: orchestrator advances delivery phase and reroutes to planning or completed."
    hooks:
      state_timeout_seconds: 86400
    transitions:
      timeout:
        to: planning
