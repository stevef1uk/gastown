id: req-flow
description: Requirements-driven workflow (Analyst -> QA spec review -> Architect -> Planner -> Polecat -> QA)
initial_state: kickoff
# State categories used by the generic stuck monitor (workflow_stuck.go) and
# rework feedback routing (rework_feedback.go). Keep state names here, not in Go.
stuck_guard:
  bead_progress_states: [planning, plan_review, test_plan, test_plan_review, test_plan_rework, project_setup, implementation, test_review, qa_review]
  planning_or_implementation_states: [planning, plan_review, test_plan, test_plan_review, test_plan_rework, project_setup, implementation, test_review]
  needs_contract_states: [planning, plan_review, test_plan, test_plan_review, test_plan_rework, project_setup, implementation, test_review]
  polecat_state: implementation
rework_feedback:
  plan_review->planning: plan_review_to_planner
  qa_review->implementation: qa_review_to_implementation
  qa_review->design: qa_review_to_design
  test_review->implementation: test_review_to_implementation
  test_review->implementation:contract_mismatch: test_review_contract_mismatch_to_implementation
  test_review->design: test_review_to_design
  test_plan->planning: test_plan_to_planner
  test_plan_review->test_plan: test_plan_review_to_tester
  implementation->test_plan_rework: test_plan_to_planner
  implementation->design: architecture_failure_to_design
  planning->design: architecture_failure_to_design
  plan_review->design: architecture_failure_to_design
  test_plan->design: architecture_failure_to_design
  test_plan_review->design: architecture_failure_to_design
  advance_phase->planning: phase_advance_to_planning
# AGENTS: Change agent behavior in this file (hooks, prompts, failure_hint) — NOT with if task.State in gt-agent.
# See internal/orchestrator/prompt_context.go and town/README.md § "FSM behavior belongs in YAML".
# Artifact guards for gt-agent. Per-rig values come from mayor/rig/.gastown/workflow-profile.json
# (gt rig spec-index). These YAML defaults are placeholders only.
# State behavior (guards, env, auto-verify) is configured under each state's hooks: block.
validation:
  bead_title_contains: "Implement "
  min_architecture_bytes: 200
  min_plan_bytes: 200
states:
  kickoff:
    role: mayor
    prompt_file: prompts/req-flow/kickoff.md
    instructions: |
      1. Ensure rig '{{rig}}' is registered and `{{rig}}/mayor/rig/REQUIREMENTS.md` exists.
      2. Report outcome success when ready for analysis.
    hooks:
      retry_hint: |
        One CMD: per line. Confirm the rig is registered and REQUIREMENTS.md exists before reporting success.
    transitions:
      success:
        to: analysis
      failure:
        to: kickoff
  analysis:
    role: analyst
    prompt_file: prompts/req-flow/analysis.md
    instructions: |
      1. Read `{{rig}}/mayor/rig/REQUIREMENTS.md` completely.
      2. Write `{{rig}}/mayor/rig/SPEC.md` — a complete, buildable technical specification that:
         - Preserves EVERY requirement from REQUIREMENTS.md (nothing dropped).
         - Fills in technical details the business requirements omit: data models, API contracts,
           error handling, testing strategy, directory layout, seed data, non-functional requirements.
         - Is structured so the Architect, Planner, and Polecat can build from it without ambiguity.
      3. Verify SPEC.md exists and meets minimum size before reporting success.
    hooks:
      max_cmd_turns: 15
      cmd_guard: analysis
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc]
      track: analysis
      artifacts: analysis
      retry_hint: |
        One CMD: per line. Read REQUIREMENTS.md with `head -n 80 {{rig}}/mayor/rig/REQUIREMENTS.md`, then write SPEC.md via heredoc. Verify with `wc -c {{rig}}/mayor/rig/SPEC.md`.
      failure_hint: |
        Write SPEC.md with a heredoc CMD in this session. Read REQUIREMENTS.md fully first.
        SPEC.md must contain: Overview, Technical Stack, Data Model, API/HTTP Routes, Frontend,
        File Layout, Phases with Success Criteria, Testing Strategy, Seed Data, and Non-Functional Requirements.
        After a successful heredoc write and `wc -c` meeting the minimum, report success.
    transitions:
      success:
        to: spec_review
      failure:
        to: analysis
  spec_review:
    role: qa
    prompt_file: prompts/req-flow/spec_review.md
    instructions: |
      1. Read both `{{rig}}/mayor/rig/REQUIREMENTS.md` and `{{rig}}/mayor/rig/SPEC.md`.
      2. Verify EVERY requirement from REQUIREMENTS.md is covered in SPEC.md — no omissions.
      3. Verify SPEC.md is complete enough for an Architect to design from: data models, API contracts,
         file layout, phases, testing strategy, seed data, and non-functional requirements.
      4. Report success only when nothing is missing. Report failure with a specific list of gaps.
    hooks:
      max_cmd_turns: 8
      cmd_guard: spec_review
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc]
      track: spec_review
      artifacts: spec_review
      retry_hint: |
        One CMD: per line. diff the requirements checklist against SPEC sections. Report gaps in summary.
      failure_hint: |
        Read both files: `head -n 80 {{rig}}/mayor/rig/REQUIREMENTS.md` and `head -n 80 {{rig}}/mayor/rig/SPEC.md`.
        List every missing requirement in your failure summary. The Analyst will fix SPEC.md.
    transitions:
      success:
        to: design
      failure:
        to: analysis
  design:
    role: architect
    prompt_file: prompts/rig-flow/design.md
    instructions: |
      1. Read `{{town_root}}/{{rig}}/mayor/rig/SPEC.md`.
      2. Create `{{town_root}}/{{rig}}/mayor/rig/architecture.md` only if absent; otherwise read the full document and amend only the reported defects (≥{{min_architecture_bytes}} bytes). Preserve unrelated design and completed-phase contracts.
      3. CRITICAL: You MUST prefix ALL file paths with `{{layout_root}}/` when layout_root ≠ "." (e.g. `{{layout_root}}/cmd/server/main.go`; bare `cmd/server/main.go` when layout_root is ".").
    hooks:
      prompt_context: [design_draft_context, spec_runtime_commands]
      pre_run: [prune_rig_root_junk]
      max_cmd_turns: 8
      cmd_guard: design
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, arch_md_after_cd, unwrap_bash_lc]
      track: design
      artifacts: design
      no_progress_limit: 3
      progress_files: [.gastown/workflow-profile.json]
      retry_hint: |
        One CMD: per line. FIRST read SPEC and the full existing architecture.md. On any rework, use sed -i or patch for the named defects and directly affected references; preserve unrelated content and completed phases. Use a single-quoted heredoc only for a missing document. After wc -c meets minimum and validation passes, summarize the amendment.
      failure_hint: |
        Read SPEC, the profile and the full existing architecture.md before editing. SPEC scope wins over an incomplete profile. Correct the single canonical delivery_phases YAML block (required_files, qa_verify_command, depends_on) and matching requirement headings; do not append duplicate canonical sections. Use standard unified diffs for Unix patch and escape literal ampersands in sed replacements. Re-read the edited section and repair failed edits before success. Preserve unrelated contracts and implementation. HTTP paths/symbols must match SPEC verbatim. Prefix implement paths with {{layout_root}}.
    transitions:
      success:
        to: design_review
      failure:
        to: design
  design_review:
    role: qa
    prompt_file: prompts/rig-flow/design_review.md
    instructions: |
      1. Review `SPEC.md` and `architecture.md` for the active phase `{{active_phase_id}}`.
      2. Verify architecture.md is complete, SPEC-aligned, and ready for planning.
      3. Confirm all active-phase required files appear in architecture.md as planned implement paths.
      4. Confirm HTTP routes, store/API names, module path, and entrypoint wiring match SPEC exactly.
      5. Confirm every SPEC runtime launch command appears verbatim in architecture.md, including `cd ... &&` and all arguments.
      6. Report success only when the design doc is clean and consistent; failure if it is missing or inconsistent.
    hooks:
      prompt_context: [spec_runtime_commands]
      max_cmd_turns: 10
      cmd_guard: design_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, unwrap_bash_lc]
      track: qa
      artifacts: design_review
      no_progress_limit: 3
      progress_files: [.gastown/workflow-profile.json]
      cmd_before_outcome_nudge: |
        You reported an outcome without reading any files, so it is not grounded in evidence. You MUST inspect the artifacts first — one CMD: per line:
        CMD: wc -c architecture.md
        CMD: cat SPEC.md
        CMD: cat architecture.md
        CMD: cat .gastown/workflow-profile.json
        Then report an outcome based on the actual file contents and byte count. Do NOT invent placeholders, missing sections, or frontend/backend files that the artifacts do not contain.
      retry_hint: |
        One CMD: per line. Read SPEC.md and architecture.md from {{rig}}/mayor/rig, then run `wc -c architecture.md`.
        Only success/failure outcomes are allowed.
      failure_hint: |
        Do not edit any files. If architecture.md has placeholders, missing required files, or disagrees with SPEC, report failure with the exact gaps.
    transitions:
      success:
        to: planning
      failure:
        to: design
  planning:
    role: planner
    prompt_file: prompts/rig-flow/planning.md
    instructions: |
      1. Read SPEC and architecture under `{{rig}}/mayor/rig/`.
      2. Create implementation beads and `plan.md` (≥{{min_plan_bytes}} bytes) with a ## Bead map: real IDs from bd list, full paths, scope + acceptance per file.
    hooks:
      dependency_review: true
      review_failure_limit: 3
      review_recovery_state: review_recovery
      prompt_context: [planning_bead_bootstrap]
      pre_run: [sync_planning_artifacts]
      state_timeout_seconds: 1800
      on_timeout: [sync_planning_on_timeout]
      max_cmd_turns: 20
      empty_response_suffix: "Reply with CMD: lines. Run: CMD: cd {{rig}}/mayor/rig && bd list --status=open && wc -c plan.md. If beads exist and plan.md >= {{min_plan_bytes}} bytes, send {\"outcome\":\"success\",\"summary\":\"beads and plan.md ready\"}. Otherwise bd create missing beads."
      cmd_guard: planning
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, plan_md_after_cd, plan_md_wc_dir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: planning
      artifacts: planning
      post_artifact_success: [sync_planning_artifacts]
      retry_hint: |
        One CMD: per line. After `cd {{rig}}/mayor/rig`, write plan.md with a relative path (not {{rig}}/mayor/rig/plan.md).
        Heredoc must end with a line containing only EOF. Verify with `wc -c {{rig}}/mayor/rig/plan.md` (full path from town root).
      failure_hint: |
        Read the review feedback and amend plan.md before success on rework. Preserve real bead IDs and exact required_files paths, including nested directories. If sync_planning_artifacts already created beads, bd list only — do not create duplicates. A byte-count check cannot replace the requested amendment. Run `cd {{rig}}/mayor/rig && wc -c plan.md` (≥ {{min_plan_bytes}} bytes). Work from {{rig}}/mayor/rig — BEADS_DIR is already set.
    transitions:
      success:
        to: plan_review
      failure:
        to: planning
      timeout:
        to: planning
      architecture_failure:
        to: design
      dependency_blocked:
        to: design
      plan_dependency_blocked:
        to: planning
  plan_review:
    role: qa
    prompt_file: prompts/rig-flow/plan_review.md
    instructions: |
      1. Verify open implementation beads match architecture.md and workflow required_files.
      2. Reject duplicate or path-less beads; send planner back to fix.
      3. Reject when SPEC.md, architecture.md, and plan.md disagree on HTTP routes, store API names, module path, or integration contract (gt-agent enforces on success).
    hooks:
      dependency_review: true
      review_failure_limit: 3
      review_recovery_state: review_recovery
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue]
      max_cmd_turns: 8
      cmd_guard: plan_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: plan_review
      artifacts: plan_review
      require_explicit_outcome: true
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Run `bd list --status=open,in_progress,closed` from {{rig}}/mayor/rig; compare titles to active-phase required_files ({{required_files}}).
      failure_hint: |
        Run `bd list --status=open,in_progress,closed` from {{rig}}/mayor/rig with BEADS_DIR set. Count implement beads for **this phase only** ({{required_files}}). Closed beads with green artifacts satisfy planning coverage; do not fail for a missing bead when only closed canonical beads exist.
    transitions:
      success:
        to: test_plan
      failure:
        to: planning
      architecture_failure:
        to: design
      dependency_blocked:
        to: design
      plan_dependency_blocked:
        to: planning
  review_recovery:
    role: mayor
    prompt_file: prompts/rig-flow/review_recovery.md
    instructions: |
      Diagnose repeated review rejection from the retained findings and authoritative rig artifacts. Select the responsible owner and send one targeted repair with concrete evidence; do not bounce the work back unchanged.
    hooks:
      max_cmd_turns: 12
      cmd_guard: plan_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      cmd_before_outcome_nudge: |
        Before routing, inspect the retained reviewer finding and the authoritative artifact it cites. Use read-only commands only; then choose the responsible owner from the allowed outcomes.
      retry_hint: |
        Read the prior review findings and compare the rejected artifact with its authoritative source before selecting one repair owner.
    transitions:
      planner_rework:
        to: planning
      architect_rework:
        to: design
      tester_rework:
        to: test_plan_rework
      implementation_rework:
        to: implementation
      qa_rework:
        to: qa_review
      pause:
        to: review_recovery
  test_plan:
    role: tester
    prompt_file: prompts/rig-flow/test_plan.md
    instructions: |
      1. Read REQUIREMENTS.md (if present), SPEC.md, architecture.md, and plan.md under `{{rig}}/mayor/rig/`.
      2. Write `{{rig}}/mayor/rig/TEST_PLAN.md` (≥{{min_test_plan_bytes}} bytes) mapping every active-phase requirement to unit/integration/UI tests with bead IDs.
      3. Report success only when the plan covers every requirement at the right level;       failure sends the planner back.
    hooks:
      native_edit_tools: true
      max_cmd_turns: 14
      cmd_guard: test_plan
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit]
      env:
        beads_dir: true
      track: test_plan
      artifacts: test_plan
      failure_prompt_context: [test_plan_rework]
      retry_hint: |
        One CMD: per line. Read SPEC.md and architecture.md from {{rig}}/mayor/rig, then `wc -c TEST_PLAN.md`.
        Only success/failure/architecture_failure outcomes are allowed.
      failure_hint: |
        TEST_PLAN.md must be ≥ {{min_test_plan_bytes}} bytes with a `### <req-id>` block per requirement: Level (unit/integration/ui), Test file, Bead ID, Scenarios, Assertions. Do not write tests — only plan them.
    transitions:
      success:
        to: test_plan_review
      failure:
        to: planning
      architecture_failure:
        to: design
  test_plan_review:
    role: qa
    prompt_file: prompts/rig-flow/test_plan_review.md
    instructions: |
      1. Review `{{rig}}/mayor/rig/TEST_PLAN.md` against SPEC.md, architecture.md, and plan.md. Note that TEST_PLAN.md covers all test-carrying phases ({{test_plan_phase_ids}}), omitting setup-only phases ({{setup_only_phase_ids}}), not just active phase `{{active_phase_id}}` — never reject sections for earlier or future phases in `{{all_delivery_phase_ids}}`.
      2. If active phase `{{active_phase_id}}` carries tests, verify a real bead ID and a declared test file or conventional companion of a required source file ({{required_files}}); companions use the source bead. Setup-only phases need no test row or architecture escalation.
      3. Confirm test levels match the plan and active-phase Bead IDs exist in `bd list --status=open,in_progress` (completed/future phases may have blank or closed Bead IDs).
      4. Report success only when the test plan is complete and SPEC-aligned; failure sends the tester back to rewrite TEST_PLAN.md.
    hooks:
      max_cmd_turns: 8
      cmd_guard: design_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, test_plan_md_after_cd, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: qa
      artifacts: test_plan_review
      retry_hint: |
        One CMD: per line. Read SPEC.md, architecture.md, plan.md and TEST_PLAN.md from {{rig}}/mayor/rig, then `wc -c TEST_PLAN.md` and `bd list --status=open,in_progress`.
        Only success/failure/architecture_failure outcomes are allowed.
      failure_hint: |
        Do not edit any files. TEST_PLAN.md must retain sections for test-carrying phases ({{test_plan_phase_ids}}) and omit setup-only phases ({{setup_only_phase_ids}}); only active phase {{active_phase_id}} requires open/in_progress Bead IDs. If TEST_PLAN.md is missing, below {{min_test_plan_bytes}} bytes, uses phase ids outside ({{all_delivery_phase_ids}}), omits requirements, or cites nonexistent active-phase bead IDs, report failure with the exact gaps.
    transitions:
      success:
        to: project_setup
      failure:
        to: test_plan
      architecture_failure:
        to: design
  test_plan_rework:
    role: tester
    prompt_file: prompts/rig-flow/test_plan.md
    instructions: |
      1. Read TEST_PLAN.md, REQUIREMENTS.md (if present), SPEC.md, architecture.md, and plan.md under `{{rig}}/mayor/rig/`.
      2. Rewrite `{{rig}}/mayor/rig/TEST_PLAN.md` (≥{{min_test_plan_bytes}} bytes) to close the gaps QA found — map EVERY active-phase requirement to unit/integration/UI tests with bead IDs.
      3. Report success only when the plan covers every requirement at the right level; failure sends you back to fix it.
    hooks:
      native_edit_tools: true
      max_cmd_turns: 10
      cmd_guard: test_plan
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit]
      env:
        beads_dir: true
      track: test_plan
      artifacts: test_plan
      retry_hint: |
        One CMD: per line. Read TEST_PLAN.md, SPEC.md and architecture.md from {{rig}}/mayor/rig, then `wc -c TEST_PLAN.md`.
        Only success/failure/architecture_failure outcomes are allowed.
      failure_hint: |
        TEST_PLAN.md must be ≥ {{min_test_plan_bytes}} bytes with a `### <req-id>` block per requirement: Level (unit/integration/ui), Test file, Bead ID, Scenarios, Assertions. Do not write tests — only plan them.
    transitions:
      success:
        to: implementation
      failure:
        to: test_plan_rework
      architecture_failure:
        to: design
  project_setup:
    role: setup
    prompt_file: prompts/rig-flow/project_setup.md
    instructions: |
      Use only the **{{project_setup_stack_kind}}** stack for this rig (see injected block below).
      Run `{{project_setup_verify_hint}}` green. Beads and plan.md are synced from required_files on pre_run — do not `bd create` unless sync left gaps. Then JSON success.
    hooks:
      dependency_review: true
      prompt_context: [project_setup_stack]
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue, prune_rig_root_junk, ensure_test_stack_ready, ensure_python_runtime_deps]
      cmd_guard: project_setup
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit]
      cmd_timeout_seconds: 180
      env:
        beads_dir: true
        python_venv: create
      pip_repair_before_run: true
      python3_rewrite: true
      track: project_setup
      auto_verify_ok_clears_cmd_failure: true
      post_artifact_success: [sync_planning_artifacts, ensure_http_implementation_config, close_project_setup_beads]
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: pip_install
          verify: python_setup
        - when: python_venv
          verify: python_setup
        - when: npm_install
          verify: node_setup
        - when: yarn_install
          verify: node_setup
        - when: pnpm_install
          verify: node_setup
      artifacts: project_setup
      retry_hint_key: project_setup
      failure_hint: |
        {{project_setup_failure_hint}} Duplicate implement beads are auto-deleted on pre_run — do not bd create more.
    transitions:
      success:
        to: implementation
      failure:
        to: project_setup
      architecture_failure:
        to: design
      dependency_blocked:
        to: design
      plan_dependency_blocked:
        to: planning
  implementation:
    role: polecat
    prompt_file: prompts/rig-flow/implementation.md
    instructions: |
      Implement the **Next bead** only: in_progress → code + unit tests tied to SPEC/plan acceptance → verify (go test / pytest per Next bead) → bd close. JSON success when all implement beads are closed.
    hooks:
      dependency_review: true
      no_progress_limit: 5
      state_timeout_seconds: 7200
      on_timeout: [recover_implementation_stall]
      on_state_timeout: [recover_implementation_stall]
      cmd_timeout_seconds: 900
      max_cmd_turns: 100
      execution_batch_size: 8
      omit_orchestrator_context: true
      system_prompt_footer: |
        **Target platform: {{target_os}}/{{target_arch}}** — use Unix paths only. Do NOT use Windows paths (C:\) or macOS-only conventions.
        Prefer READ:/EDIT:/WRITE: for source and test files; `CMD: <shell>` for bd and Verify only. Add/update unit tests from plan.md acceptance before bd close. JSON success in a later message (not with CMD or native tools).

        ## Required format (follow exactly — no JSON wrappers, no markdown fences)

        **New file:**
        WRITE: {{layout_root}}/path/file.go
        package pkg

        func main() {
        }
        ---END WRITE---

        **Edit existing file:**
        EDIT: {{layout_root}}/path/file.go
        <<<<<<< SEARCH
        old code
        =======
        new code
        >>>>>>> REPLACE

        **Shell commands (one per line):**
        CMD: cd {{rig}}/mayor/rig && bd update BEAD_ID --status=in_progress
        CMD: cd {{rig}}/mayor/rig/{{layout_root}} && go test -count=1 ./...

        **Close bead after verify passes:**
        CMD: cd {{rig}}/mayor/rig && bd close BEAD_ID

        **Do NOT wrap CMD in angle brackets** — use plain `CMD: ...` not `<CMD: ...>`.

        **Frontend beads:** Use the declared frontend toolchain and Next bead Verify command before closing. Run typecheck/build/component tests for bundled JavaScript or TypeScript projects; use the configured static checks for plain assets.

        **SQL beads (.sql):** Validate with the sqlite3 verify command shown in the Next bead line. Do NOT run pytest on .sql files.

        **One bead at a time:** Update ONE bead to in_progress → WRITE/EDIT that file → `bd close`. Do not batch multiple beads.

        **Result (SEPARATE message, NO CMD/WRITE/EDIT lines):**
        {"outcome":"success","summary":"Implemented handlers.go and tests; go test passes"}

        **When verify fails:** First READ the failing file and the dependencies it calls. Then explain the failure in ONE sentence, then apply the fix with EDIT:/WRITE:. Do not try random edits — diagnose from the error output. Record reusable lessons with `LEARN: <concise one-line rule>` (<=140 chars).

        **Web frontend:** Follow the SPEC and detected package toolchain. Use React/Next/Vite and module imports when declared. For unbundled static pages use browser-compatible scripts and match DOM IDs. Keep server/database functions out of browser code.
      user_prompt_wrapper: none
      failure_prompt_context: [implementation_queue, implement_bead_context, phase_test_guards, polecat_learnings]
      empty_response_suffix: "Reply with EDIT:/WRITE:/READ: or CMD: lines. Implement code and unit tests per plan.md; WRITE for new *_test.go or tests/test_*.py. Use Verify from Next bead."
      prompt_context: [missing_implement_files, implementation_queue, implement_bead_context, phase_test_guards, coding_standards, polecat_learnings]
      pre_run: [prune_rig_root_junk, repair_project_git_ignores, ensure_dolt_auto_commit, ensure_dolt_schema_health, sync_planning_artifacts, ensure_http_implementation_config, ensure_handler_phase_prerequisites, ensure_implement_smoke_ready, enforce_implement_bead_queue, prune_stale_layout_files, repair_requirements, refresh_codeindex, reconcile_implement_beads, ensure_test_stack_ready, ensure_playwright_config_ready]
      # Do not run repair_planning_beads / refresh_plan_md_if_stale per turn — they create beads and
      # rewrite plan.md mid-implementation (see pre_run sync + reconcile). Planning-only repair stays in planning state hooks.
      per_turn: [prune_stale_layout_files, repair_requirements]
      cmd_guard: implementation
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, backend_path_after_cd, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: implementation
      append_go_compile_context: true
      native_edit_tools: true
      empty_bd_list_ok: true
      auto_verify:
        - when: go_mod_tidy
          verify: go_implementation
        - when: go_mod_init
          verify: go_implementation
        - when: go_write_layout
          verify: go_implementation
        - when: python_test
          verify: python_implementation
        - when: python_import_check
          verify: python_implementation
        - when: python_compileall
          verify: python_implementation
      artifacts: implementation
      retry_hint_key: implementation
      failure_hint: |
        One bead at a time: bd update → **EDIT:** / **WRITE:** (include *_test.go or tests/test_*.py mapped to SPEC/plan) → verify from Next bead (go test / pytest) → bd close. Use CMD only for bd/verify. go run/curl only on cmd/server/main.go bead.
        After QA failure rework: READ the QA-cited file on disk first. If the file already exists and verify passes, bd close it — do NOT rewrite files that QA falsely claimed as missing/broken. Only make changes when QA's claim is confirmed.
    transitions:
      success:
        to: test_review
      failure:
        to: planning
      plan_gap:
        to: test_plan_rework
      architecture_failure:
        to: design
      dependency_blocked:
        to: design
      plan_dependency_blocked:
        to: planning
      checkpoint:
        to: implementation
      timeout:
        to: implementation
  test_review:
    role: tester
    prompt_file: prompts/rig-flow/test_review.md
    instructions: |
      1. Read TEST_PLAN.md, SPEC.md, and architecture.md under `{{rig}}/mayor/rig/`; compare each requirement to its planned test file.
      2. Confirm every active-phase test file exists, has real assertions (not stubs), and the phase verify ({{phase_qa_verify_command}}) is green.
      3. Report success only when tests cover every requirement; failure names failing beads (polecat) when a test is missing/weak or verify fails; plan_gap when the plan is incomplete (tester rewrites TEST_PLAN.md); contract_mismatch when green tests assert behavior that contradicts a specific SPEC clause and the fix belongs in production code; architecture_failure when SPEC/architecture themselves are the blocker (architect).
      4. For contract_mismatch include in the JSON summary: `Implementation repair: <test path>`, `SPEC: <file:section> "<exact clause>"`, `Assertion: <test path>:<line> "<exact assertion>"`, `Production fix: <source path>:<line> <change>`, and the owning bead ID. Green tests alone are not evidence of conformance.
    hooks:
      review_failure_limit: 3
      review_recovery_state: review_recovery
      max_cmd_turns: 20
      cmd_guard: test_review
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit, bd_strip_beads_dir, unittest_workdir]
      env:
        pythonpath: true
        python_venv: activate
        beads_dir: true
      pip_repair_before_run: true
      python3_rewrite: true
      track: test_review
      artifacts: test_review
      require_explicit_outcome: true
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Read TEST_PLAN.md and the test files it names from {{rig}}/mayor/rig; run {{phase_qa_verify_command}}.
        Allowed outcomes: success, failure, contract_mismatch, plan_gap, architecture_failure.
      failure_hint: |
        Do not edit source or tests. If a test file is missing, weak, or verify fails, report failure with the bead IDs and test paths. If tests are green but assert behavior that contradicts SPEC.md and a source change can fix it, report contract_mismatch with the SPEC clause quote, exact assertion with line number, production file to change, and bead ID; do not use failure. If TEST_PLAN.md itself is incomplete, use plan_gap. If SPEC/architecture themselves conflict, use architecture_failure.
    transitions:
      success:
        to: qa_review
      failure:
        to: implementation
      contract_mismatch:
        to: implementation
      plan_gap:
        to: test_plan_rework
      architecture_failure:
        to: design
      timeout:
        to: test_review
  qa_review:
    role: qa
    prompt_file: prompts/rig-flow/qa_review.md
    instructions: |
      1. Review closed implementation beads in `{{rig}}` against SPEC.md and architecture.md (static `src`/`href` in web/index.html must match the architecture HTTP table — {{static_url_contract_short}}).
      2. Follow qa_runtime_smoke_block for runtime checks when SPEC/architecture define HTTP routes or static web+server. It selects the app runtime from rig documentation/profile; the unit-test language does not imply a Python, Go, or host-server runtime. Skip go run/curl for library-only or API-less profiles.
      3. Use task_passed (more work), all_passed (done), failure (evidenced code/test defects), or verification_error (command/environment could not complete verification).
    hooks:
      verification_error_limit: 3
      review_failure_limit: 3
      review_recovery_state: review_recovery
      prompt_context: [missing_implement_files]
      state_timeout_seconds: 1800
      cmd_timeout_seconds: 900
      append_go_compile_context: true
      max_cmd_turns: 8
      pre_run: [ensure_dolt_auto_commit, ensure_dolt_schema_health, reconcile_implement_beads]
      per_turn: [repair_requirements]
      cmd_guard: qa
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: qa
      artifacts: qa
      bead_ids_in_summary: true
      cmd_before_outcome_nudge: |
        You reported an outcome without running any commands. You MUST run the verify command first and report its actual output:
        CMD: cd {{rig}}/mayor/rig && {{qa_verify_command}}
        Do NOT guess or assume — run the command and report what it says.
      retry_hint: |
        One CMD: per line. Review closed beads against SPEC and architecture; use allowed QA outcomes only.
      failure_hint: |
        Run the configured phase verification directly from {{rig}}/mayor/rig and follow qa_runtime_smoke_block for the documented app runtime. Do not infer the server lifecycle from the test language or prepend pkill, killall, or port-killing cleanup. If execution cannot reach the checks, use verification_error with the actual command/error; no repair bead IDs. For application/test defects, use failure with a summary and a findings array containing every defect, each with its own summary, repair_bead_ids (only actual defect owners), evidence, and paths when known. Do not stop after the first finding. A closed-bead inventory is never a repair list.
    transitions:
      task_passed:
        to: implementation
      all_passed:
        to: advance_phase
      failure:
        to: implementation
      architecture_failure:
        to: design
      verification_error:
        to: qa_review
      timeout:
        to: qa_review
  advance_phase:
    role: ""
    prompt_file: ""
    instructions: "Internal: orchestrator advances delivery phase and reroutes to planning or completed."
    hooks:
      state_timeout_seconds: 86400
    transitions:
      timeout:
        to: planning
