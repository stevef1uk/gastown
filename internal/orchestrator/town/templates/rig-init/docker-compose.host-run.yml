# Docker compose for Playwright E2E testing
# Used in integration-test phase
# Template variables: {{PLAYWRIGHT_IMAGE}}, {{PLAYWRIGHT_WORKDIR}}, {{PLAYWRIGHT_COMMAND}}, {{PLAYWRIGHT_BASE_URL}}, {{WEB_PORT}}
# The web app runs on HOST (not in Docker). The Playwright container reaches it via
# host.docker.internal (extra_hosts host-gateway), which works on both Linux and macOS
# Docker Desktop — host networking does NOT expose the macOS host's loopback to containers.
# The host source tree is mounted READ-ONLY at /src so the container can never modify or delete
# rig files (git metadata, SPEC, plan, architecture, source). A multi-stage Dockerfile
# is used to pre-install npm dependencies. Source is copied into a writable
# /app volume where Playwright writes test-results/, and playwright-report/ without touching the host tree.
# Multi-stage Dockerfile handles npm install during build.

services:
  playwright:
    build:
      context: .
      target: playwright
    working_dir: {{PLAYWRIGHT_WORKDIR}}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - BASE_URL={{PLAYWRIGHT_BASE_URL}}
    command: sh -c "{{PLAYWRIGHT_COMMAND}}"

volumes:
  playwright-app:
