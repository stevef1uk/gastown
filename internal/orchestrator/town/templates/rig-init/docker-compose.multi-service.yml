# Docker compose test harness for multi-service rig
# Template variables: {{PLAYWRIGHT_IMAGE}}, {{PLAYWRIGHT_WORKDIR}}, {{PLAYWRIGHT_COMMAND}}, {{BASE_URL}}, {{SERVICES_BLOCK}}, {{E2E_DEPENDS_ON}}
# Reproduces all SPEC services plus the playwright runner. The runner service is
# named "playwright" so the integration-test verify command
# ("docker compose up --exit-code-from playwright") targets the right service.

services:
{{SERVICES_BLOCK}}
  playwright:
    image: {{PLAYWRIGHT_IMAGE}}
    working_dir: /app
    depends_on:
      {{E2E_DEPENDS_ON}}
    volumes:
      - .:/src:ro
      - e2e-results:/app/test-results
    environment:
      - BASE_URL={{BASE_URL}}
    command: sh -c "cp -r /src/. /app/ && npm install --no-package-lock && {{PLAYWRIGHT_COMMAND}}"

volumes:
  e2e-results: