# Docker compose test harness for multi-service rig
# Template variables: {{PLAYWRIGHT_IMAGE}}, {{PLAYWRIGHT_WORKDIR}}, {{PLAYWRIGHT_COMMAND}}, {{BASE_URL}}
# Reproduces all SPEC services plus the playwright runner. The runner service is
# named "playwright" so the integration-test verify command
# ("docker compose up --exit-code-from playwright") targets the right service.
# Source files are mounted via volumes so test changes don't require image rebuilds.

services:
{{SERVICES_BLOCK}}
  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
      target: playwright
    working_dir: /app
    depends_on:
      {{E2E_DEPENDS_ON}}
    environment:
      - BASE_URL={{BASE_URL}}
      - CI=1
      - PLAYWRIGHT_HTML_OPEN=never
    volumes:
      - ./:/src:ro
    command: sh -c "tar -C /src --exclude=./node_modules --exclude=./.git --exclude=./playwright-report --exclude=./test-results -cf - . | tar -C /app -xf - && {{PLAYWRIGHT_COMMAND}}"
