# Docker compose test harness for multi-service rig
# Template variables: {{PLAYWRIGHT_IMAGE}}, {{PLAYWRIGHT_WORKDIR}}, {{PLAYWRIGHT_COMMAND}}, {{BASE_URL}}
# Reproduces all SPEC services plus the playwright runner. The runner service is
# named "playwright" so the integration-test verify command
# ("docker compose up --exit-code-from playwright") targets the right service.

services:
{{SERVICES_BLOCK}}
  playwright:
    build:
      context: .
      target: playwright
    working_dir: /app
    depends_on:
      {{E2E_DEPENDS_ON}}
    environment:
      - BASE_URL={{BASE_URL}}
    command: sh -c "{{PLAYWRIGHT_COMMAND}}"

volumes:
  e2e-results: