# Docker compose test harness for single-container rig
# Template variables: {{PLAYWRIGHT_IMAGE}}, {{PLAYWRIGHT_WORKDIR}}, {{PLAYWRIGHT_COMMAND}}, {{BASE_URL}}, {{APP_PORT}}, {{APP_BUILD}}, {{HEALTHCHECK}}, {{ENV_BLOCK}}
# App runs in its own container; Playwright reaches it over the internal compose network.
# Multi-stage Dockerfile is used to pre-install npm dependencies.
# Source files are mounted via volumes so test changes don't require image rebuilds.

services:
  app:
    build:
      context: {{APP_BUILD}}
    ports:
      - "{{APP_PORT}}:{{APP_PORT}}"
    environment:
      - {{ENV_BLOCK}}
    healthcheck:
      test: [{{HEALTHCHECK}}]
      interval: 5s
      timeout: 5s
      retries: 20

  playwright:
    build:
      context: {{APP_BUILD}}
      target: playwright
    working_dir: {{PLAYWRIGHT_WORKDIR}}
    depends_on:
      app:
        condition: service_healthy
    environment:
      - BASE_URL={{BASE_URL}}
    volumes:
      - ./:/src:ro
      - playwright-app:/app
    command: sh -c "cp -r /src/* /app/ 2>/dev/null || true && cp -r /src/.* /app/ 2>/dev/null || true && {{PLAYWRIGHT_COMMAND}}"

volumes:
  playwright-app: