id: rig-flow
description: Standard rig workflow (Mayor -> Architect -> Planner -> Polecat -> QA) aligned with Beads/Dolt
initial_state: kickoff
# AGENTS: Change agent behavior in this file (hooks, prompts, failure_hint) — NOT with if task.State in gt-agent.
# See internal/orchestrator/prompt_context.go and town/README.md § "FSM behavior belongs in YAML".
# Artifact guards for gt-agent. Per-rig values come from mayor/rig/.gastown/workflow-profile.json
# (gt rig spec-index). These YAML defaults are placeholders only.
# State behavior (guards, env, auto-verify) is configured under each state's hooks: block.
validation:
  bead_title_contains: "Implement "
  min_architecture_bytes: 200
  min_plan_bytes: 200
states:
  kickoff:
    role: mayor
    prompt_file: prompts/rig-flow/kickoff.md
    instructions: |
      1. Ensure rig '{{rig}}' is registered and `{{rig}}/mayor/rig/SPEC.md` exists.
      2. Report outcome success when ready for design.
    hooks:
      retry_hint: |
        One CMD: per line. Confirm the rig is registered and SPEC.md exists before reporting success.
    transitions:
      success:
        to: design
      failure:
        to: kickoff
  design:
    role: architect
    prompt_file: prompts/rig-flow/design.md
    instructions: |
      1. Read `{{rig}}/mayor/rig/SPEC.md`.
      2. Write `{{rig}}/mayor/rig/architecture.md` (≥{{min_architecture_bytes}} bytes).
    hooks:
      max_cmd_turns: 8
      cmd_guard: design
      cmd_rewrites: [rig_placeholders, spec_md_case, unwrap_bash_lc]
      track: design
      artifacts: design
      retry_hint: |
        One CMD: per line. Read SPEC with head; write architecture.md via a single-quoted heredoc (≥200 bytes).
        Prose may mention python3 or backend/ paths — that is fine inside the document.
      failure_hint: |
        Write architecture.md with a heredoc CMD in this session (stale files from prior runs do not count). Read SPEC with head -n 60.
    transitions:
      success:
        to: planning
      failure:
        to: design
  planning:
    role: planner
    prompt_file: prompts/rig-flow/planning.md
    instructions: |
      1. Read SPEC and architecture under `{{rig}}/mayor/rig/`.
      2. Create implementation beads and `plan.md`.
    hooks:
      prompt_context: [planning_bead_bootstrap]
      # Optional: pre_run: [bootstrap_implement_beads]  # auto-create missing beads (planner normally runs bd create)
      max_cmd_turns: 8
      cmd_guard: planning
      cmd_rewrites: [rig_placeholders, spec_md_case, plan_md_after_cd, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: planning
      artifacts: planning
      retry_hint: |
        One CMD: per line. After `cd {{rig}}/mayor/rig`, write plan.md with a relative path (not {{rig}}/mayor/rig/plan.md).
        Heredoc must end with a line containing only EOF. Verify with wc -c from town root.
      failure_hint: |
        Do not send success JSON until CMD: lines ran in this session. If beads exist, bd list only — do not duplicate bd create. plan.md heredoc must end with a line containing only EOF (short body ≥ {{min_plan_bytes}} bytes or the model output will truncate). Then wc -c plan.md, then JSON only. Work from {{rig}}/mayor/rig with BEADS_DIR=$GT_ROOT/{{rig}}/.beads.
    transitions:
      success:
        to: plan_review
      failure:
        to: planning
  plan_review:
    role: qa
    prompt_file: prompts/rig-flow/plan_review.md
    instructions: |
      1. Verify open implementation beads match architecture.md and workflow required_files.
      2. Reject duplicate or path-less beads; send planner back to fix.
    hooks:
      max_cmd_turns: 8
      cmd_guard: plan_review
      cmd_rewrites: [rig_placeholders, spec_md_case, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: plan_review
      artifacts: plan_review
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Run bd list --status=open from {{rig}}/mayor/rig; compare titles to architecture required_files.
      failure_hint: |
        Run `bd list --status=open` from {{rig}}/mayor/rig with BEADS_DIR set; compare titles to architecture required_files. Use outcome failure to send the Planner back.
    transitions:
      success:
        to: project_setup
      failure:
        to: planning
  project_setup:
    role: setup
    prompt_file: prompts/rig-flow/project_setup.md
    instructions: |
      1. Go: scaffold module (go mod init/tidy), split beads one file each, green verify.
      2. Python: create venv, pip install -r requirements.txt once, split beads, green pytest/unittest.
    hooks:
      pre_run: [enforce_implement_bead_queue]
      cmd_guard: project_setup
      cmd_rewrites: [rig_placeholders, bd_list_implement_scope, unittest_workdir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
        python_venv: create
      pip_repair_before_run: true
      python3_rewrite: true
      track: project_setup
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: pip_install
          verify: python
        - when: python_venv
          verify: python
      artifacts: project_setup
      retry_hint_key: project_setup
      failure_hint: |
        project_setup scaffolds the Go module only (go mod init/get/tidy under {{layout_root}}/). Do NOT cat/heredoc/touch source files. Duplicate implement beads are auto-deleted on pre_run — do not bd create more. Run {{project_setup_verify_hint}} green, then JSON success only (no CMD in that message).
    transitions:
      success:
        to: implementation
      failure:
        to: project_setup
  implementation:
    role: polecat
    prompt_file: prompts/rig-flow/implementation.md
    instructions: |
      Implement the **Next bead** in the user message only: in_progress → heredoc file → verify → bd close. JSON success when all implement beads are closed.
    hooks:
      max_cmd_turns: 12
      omit_orchestrator_context: true
      system_prompt_footer: |
        Format: `CMD: <shell>` one per line; JSON `{"outcome":"success","summary":"..."}` only in a later message (not with CMD).
      user_prompt_wrapper: none
      failure_prompt_context: [implementation_queue]
      empty_response_suffix: "Reply with CMD lines only. Use Verify from Next bead; fix .go files in Source context when tidy/build fails."
      prompt_context: [implementation_queue]
      pre_run: [enforce_implement_bead_queue, prune_stale_layout_go, repair_requirements, reopen_implement_beads]
      per_turn: [repair_requirements]
      cmd_guard: implementation
      cmd_rewrites: [rig_placeholders, backend_path_after_cd, bd_list_implement_scope, unittest_workdir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: implementation
      append_go_compile_context: true
      empty_bd_list_ok: true
      auto_verify:
        - when: go_mod_tidy
          verify: go_implementation
        - when: go_write_layout
          verify: go_implementation
      artifacts: implementation
      retry_hint_key: implementation
      failure_hint: |
        One bead at a time for **Next bead** only: bd update → heredoc that path → verify (see Next bead line) → bd close. go run/curl only on cmd/server/main.go bead; other beads use go build ./...
    transitions:
      success:
        to: qa_review
      failure:
        to: implementation
  qa_review:
    role: qa
    prompt_file: prompts/rig-flow/qa_review.md
    instructions: |
      1. Review closed implementation beads in `{{rig}}` against SPEC and architecture.
      2. Use outcome task_passed (more work), all_passed (done), or failure (rework).
    hooks:
      max_cmd_turns: 8
      per_turn: [repair_requirements]
      cmd_guard: qa
      cmd_rewrites: [rig_placeholders, bd_list_implement_scope, unittest_workdir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: qa
      artifacts: qa
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Review closed beads against SPEC and architecture; use allowed QA outcomes only.
      failure_hint: |
        Run real CMD: lines: bd list --status=closed, head SPEC.md, {{unittest_command_hint}} from {{rig}}/mayor/rig. Then JSON only.
    transitions:
      task_passed:
        to: implementation
      all_passed:
        to: completed
      failure:
        to: implementation
