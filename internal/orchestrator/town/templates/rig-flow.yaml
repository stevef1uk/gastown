id: rig-flow
description: Standard rig workflow (Mayor -> Architect -> Planner -> Polecat -> QA) aligned with Beads/Dolt
initial_state: kickoff
# State categories used by the generic stuck monitor (workflow_stuck.go) and
# rework feedback routing (rework_feedback.go). Keep state names here, not in Go.
stuck_guard:
  bead_progress_states: [planning, plan_review, test_plan, test_plan_rework, project_setup, implementation, test_review, qa_review]
  planning_or_implementation_states: [planning, plan_review, test_plan, test_plan_rework, project_setup, implementation, test_review]
  needs_contract_states: [planning, plan_review, test_plan, test_plan_rework, project_setup, implementation, test_review]
  polecat_state: implementation
rework_feedback:
  plan_review->planning: plan_review_to_planner
  qa_review->implementation: qa_review_to_implementation
  qa_review->design: qa_review_to_design
  test_review->implementation: test_review_to_implementation
  test_review->design: test_review_to_design
  test_plan->planning: test_plan_to_planner
  implementation->test_plan_rework: test_plan_to_planner
  implementation->design: architecture_failure_to_design
  planning->design: architecture_failure_to_design
  plan_review->design: architecture_failure_to_design
  test_plan->design: architecture_failure_to_design
  advance_phase->planning: phase_advance_to_planning
# AGENTS: Change agent behavior in this file (hooks, prompts, failure_hint) — NOT with if task.State in gt-agent.
# See internal/orchestrator/prompt_context.go and town/README.md § "FSM behavior belongs in YAML".
# Artifact guards for gt-agent. Per-rig values come from mayor/rig/.gastown/workflow-profile.json
# (gt rig spec-index). These YAML defaults are placeholders only.
# State behavior (guards, env, auto-verify) is configured under each state's hooks: block.
validation:
  bead_title_contains: "Implement "
  min_architecture_bytes: 200
  min_plan_bytes: 200
states:
  kickoff:
    role: mayor
    prompt_file: prompts/rig-flow/kickoff.md
    instructions: |
      1. Ensure rig '{{rig}}' is registered and `{{rig}}/mayor/rig/SPEC.md` exists.
      2. Report outcome success when ready for design.
    hooks:
      retry_hint: |
        One CMD: per line. Confirm the rig is registered and SPEC.md exists before reporting success.
    transitions:
      success:
        to: design
      failure:
        to: kickoff
  design:
    role: architect
    prompt_file: prompts/rig-flow/design.md
    instructions: |
      1. Read `{{town_root}}/{{rig}}/mayor/rig/SPEC.md`.
      2. Write `{{town_root}}/{{rig}}/mayor/rig/architecture.md` (≥{{min_architecture_bytes}} bytes).
      3. CRITICAL: You MUST prefix ALL file paths with `layout_root/` (e.g. `layout_root/cmd/server/main.go`).
    hooks:
      prompt_context: [design_draft_context]
      pre_run: [reset_layout_pre_implementation, prune_rig_root_junk]
      max_cmd_turns: 8
      cmd_guard: design
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, arch_md_after_cd, unwrap_bash_lc]
      track: design
      artifacts: design
      retry_hint: |
        One CMD: per line. Read SPEC with head; write architecture.md via single-quoted heredoc. On design_review rework, FIRST `cat {{rig}}/mayor/rig/architecture.md` to see what QA approved, then `sed -i` targeted fixes (or a full heredoc only if needed). After wc -c meets minimum, auto-completes.
      failure_hint: |
        FIRST run `CMD: cat {{rig}}/mayor/rig/.gastown/workflow-profile.json` and use the EXACT `delivery_phases[].id` values as your `### <req-id>` headings — phase IDs change between index runs and stale IDs are rejected. Write architecture.md with heredoc CMD in this session (stale files don't count). On design_review rework, read the existing architecture.md first and fix only the QA-named defects (path collisions, db/route drift, Docker judge) with sed -i. Read SPEC with head -n 60. HTTP paths/symbols must match SPEC verbatim. Prefix implement paths with layout_root.
    transitions:
      success:
        to: design_review
      failure:
        to: design
  design_review:
    role: qa
    prompt_file: prompts/rig-flow/design_review.md
    instructions: |
      1. Review `SPEC.md` and `architecture.md` for the active phase `{{active_phase_id}}`.
      2. Verify architecture.md is complete, SPEC-aligned, and ready for planning.
      3. Confirm all active-phase required files appear in architecture.md as planned implement paths.
      4. Confirm HTTP routes, store/API names, module path, and entrypoint wiring match SPEC exactly.
      5. Report success only when the design doc is clean and consistent; failure if it is missing or inconsistent.
    hooks:
      max_cmd_turns: 10
      cmd_guard: design_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, unwrap_bash_lc]
      track: qa
      artifacts: design_review
      retry_hint: |
        One CMD: per line. Read SPEC.md and architecture.md from {{rig}}/mayor/rig, then run `wc -c architecture.md`.
        Only success/failure outcomes are allowed.
      failure_hint: |
        Do not edit any files. If architecture.md has placeholders, missing required files, or disagrees with SPEC, report failure with the exact gaps.
    transitions:
      success:
        to: planning
      failure:
        to: design
  planning:
    role: planner
    prompt_file: prompts/rig-flow/planning.md
    instructions: |
      1. Read SPEC and architecture under `{{rig}}/mayor/rig/`.
      2. Create implementation beads and `plan.md` (≥{{min_plan_bytes}} bytes) with a ## Bead map: real IDs from bd list, full paths, scope + acceptance per file.
    hooks:
      prompt_context: [planning_bead_bootstrap]
      pre_run: [sync_planning_artifacts]
      state_timeout_seconds: 1800
      on_timeout: [sync_planning_on_timeout]
      max_cmd_turns: 20
      empty_response_suffix: "Reply with CMD: lines. Run: CMD: cd {{rig}}/mayor/rig && bd list --status=open && wc -c plan.md. If beads exist and plan.md >= {{min_plan_bytes}} bytes, send {\"outcome\":\"success\",\"summary\":\"beads and plan.md ready\"}. Otherwise bd create missing beads."
      cmd_guard: planning
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, plan_md_after_cd, plan_md_wc_dir, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: planning
      artifacts: planning
      post_artifact_success: [sync_planning_artifacts]
      retry_hint: |
        One CMD: per line. After `cd {{rig}}/mayor/rig`, write plan.md with a relative path (not {{rig}}/mayor/rig/plan.md).
        Heredoc must end with a line containing only EOF. Verify with `wc -c {{rig}}/mayor/rig/plan.md` (full path from town root).
      failure_hint: |
        Do not send success JSON until CMD: lines ran in this session. If sync_planning_artifacts already created beads, bd list only — gt-agent rejects bd create when required_files are covered. Do **not** heredoc plan.md when required_files use {{layout_root}}/internal/ or {{layout_root}}/cmd/ — sync builds plan.md with full paths. Run `cd {{rig}}/mayor/rig && wc -c plan.md` (≥ {{min_plan_bytes}} bytes; use full path `wc -c {{rig}}/mayor/rig/plan.md` from town root if no cd). Work from {{rig}}/mayor/rig — the environment already has BEADS_DIR set to the rig's beads database.
    transitions:
      success:
        to: plan_review
      failure:
        to: planning
      timeout:
        to: planning
      architecture_failure:
        to: design
  plan_review:
    role: qa
    prompt_file: prompts/rig-flow/plan_review.md
    instructions: |
      1. Verify open implementation beads match architecture.md and workflow required_files.
      2. Reject duplicate or path-less beads; send planner back to fix.
      3. Reject when SPEC.md, architecture.md, and plan.md disagree on HTTP routes, store API names, module path, or integration contract (gt-agent enforces on success).
    hooks:
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue]
      max_cmd_turns: 8
      cmd_guard: plan_review
      cmd_rewrites: [rig_placeholders, spec_md_case, spec_md_after_cd, bd_list_limit, unwrap_bash_lc]
      env:
        beads_dir: true
      track: plan_review
      artifacts: plan_review
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Run bd list --status=open,in_progress from {{rig}}/mayor/rig; compare titles to active-phase required_files ({{required_files}}).
      failure_hint: |
        Run `bd list --status=open,in_progress` from {{rig}}/mayor/rig with BEADS_DIR set. Count implement beads for **this phase only** ({{required_files}}). {{integration_contract_scope_note}} Use outcome failure for duplicate/missing beads or plan drift — not for integration contract when the active phase has no cmd/.../main.go.
    transitions:
      success:
        to: test_plan
      failure:
        to: planning
      architecture_failure:
        to: design
  test_plan:
    role: tester
    prompt_file: prompts/rig-flow/test_plan.md
    instructions: |
      1. Read REQUIREMENTS.md (if present), SPEC.md, architecture.md, and plan.md under `{{rig}}/mayor/rig/`.
      2. Write `{{rig}}/mayor/rig/TEST_PLAN.md` (≥{{min_test_plan_bytes}} bytes) mapping every active-phase requirement to unit/integration/UI tests with bead IDs.
      3. Report success only when the plan covers every requirement at the right level;       failure sends the planner back.
    hooks:
      max_cmd_turns: 14
      cmd_guard: test_plan
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit]
      env:
        beads_dir: true
      track: test_plan
      artifacts: test_plan
      retry_hint: |
        One CMD: per line. Read SPEC.md and architecture.md from {{rig}}/mayor/rig, then `wc -c TEST_PLAN.md`.
        Only success/failure/architecture_failure outcomes are allowed.
      failure_hint: |
        TEST_PLAN.md must be ≥ {{min_test_plan_bytes}} bytes with a `### <req-id>` block per requirement: Level (unit/integration/ui), Test file, Bead ID, Scenarios, Assertions. Do not write tests — only plan them.
    transitions:
      success:
        to: project_setup
      failure:
        to: planning
      architecture_failure:
        to: design
  test_plan_rework:
    role: tester
    prompt_file: prompts/rig-flow/test_plan.md
    instructions: |
      1. Read TEST_PLAN.md, REQUIREMENTS.md (if present), SPEC.md, architecture.md, and plan.md under `{{rig}}/mayor/rig/`.
      2. Rewrite `{{rig}}/mayor/rig/TEST_PLAN.md` (≥{{min_test_plan_bytes}} bytes) to close the gaps QA found — map EVERY active-phase requirement to unit/integration/UI tests with bead IDs.
      3. Report success only when the plan covers every requirement at the right level; failure sends you back to fix it.
    hooks:
      max_cmd_turns: 10
      cmd_guard: test_plan
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit]
      env:
        beads_dir: true
      track: test_plan
      artifacts: test_plan
      retry_hint: |
        One CMD: per line. Read TEST_PLAN.md, SPEC.md and architecture.md from {{rig}}/mayor/rig, then `wc -c TEST_PLAN.md`.
        Only success/failure/architecture_failure outcomes are allowed.
      failure_hint: |
        TEST_PLAN.md must be ≥ {{min_test_plan_bytes}} bytes with a `### <req-id>` block per requirement: Level (unit/integration/ui), Test file, Bead ID, Scenarios, Assertions. Do not write tests — only plan them.
    transitions:
      success:
        to: implementation
      failure:
        to: test_plan_rework
      architecture_failure:
        to: design
  project_setup:
    role: setup
    prompt_file: prompts/rig-flow/project_setup.md
    instructions: |
      Use only the **{{project_setup_stack_kind}}** stack for this rig (see injected block below).
      Run `{{project_setup_verify_hint}}` green. Beads and plan.md are synced from required_files on pre_run — do not `bd create` unless sync left gaps. Then JSON success.
    hooks:
      prompt_context: [project_setup_stack]
      pre_run: [sync_planning_artifacts, enforce_implement_bead_queue, prune_rig_root_junk, ensure_test_stack_ready]
      cmd_guard: project_setup
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit]
      env:
        beads_dir: true
        python_venv: create
      pip_repair_before_run: true
      python3_rewrite: true
      track: project_setup
      auto_verify_ok_clears_cmd_failure: true
      post_artifact_success: [sync_planning_artifacts, ensure_http_implementation_config, close_project_setup_beads]
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: pip_install
          verify: python_setup
        - when: python_venv
          verify: python_setup
        - when: npm_install
          verify: node_setup
        - when: yarn_install
          verify: node_setup
        - when: pnpm_install
          verify: node_setup
      artifacts: project_setup
      retry_hint_key: project_setup
      failure_hint: |
        {{project_setup_failure_hint}} Duplicate implement beads are auto-deleted on pre_run — do not bd create more.
    transitions:
      success:
        to: implementation
      failure:
        to: project_setup
      architecture_failure:
        to: design
  implementation:
    role: polecat
    prompt_file: prompts/rig-flow/implementation.md
    instructions: |
      Implement the **Next bead** only: in_progress → code + unit tests tied to SPEC/plan acceptance → verify (go test / pytest per Next bead) → bd close. JSON success when all implement beads are closed.
    hooks:
      state_timeout_seconds: 7200
      on_timeout: [recover_implementation_stall]
      on_state_timeout: [recover_implementation_stall]
      cmd_timeout_seconds: 900
      max_cmd_turns: 100
      omit_orchestrator_context: true
      system_prompt_footer: |
        **Target platform: {{target_os}}/{{target_arch}}** — use Unix paths only. Do NOT use Windows paths (C:\) or macOS-only conventions.
        Prefer READ:/EDIT:/WRITE: for source and test files; `CMD: <shell>` for bd and Verify only. Add/update unit tests from plan.md acceptance before bd close. JSON success in a later message (not with CMD or native tools).

        ## Required format (follow exactly — no JSON wrappers, no markdown fences)

        **New file:**
        WRITE: {{layout_root}}/path/file.go
        package pkg

        func main() {
        }
        ---END WRITE---

        **Edit existing file:**
        EDIT: {{layout_root}}/path/file.go
        <<<<<<< SEARCH
        old code
        =======
        new code
        >>>>>>> REPLACE

        **Shell commands (one per line):**
        CMD: cd {{rig}}/mayor/rig && bd update BEAD_ID --status=in_progress
        CMD: cd {{rig}}/mayor/rig/{{layout_root}} && go test -count=1 ./...

        **Close bead after verify passes:**
        CMD: cd {{rig}}/mayor/rig && bd close BEAD_ID

        **Do NOT wrap CMD in angle brackets** — use plain `CMD: ...` not `<CMD: ...>`.

        **Frontend beads (JS/CSS/HTML):** No verify step needed. Write the file, then `bd close` immediately. Do not run compileall/pytest/go test on web assets.

        **SQL beads (.sql):** Validate with the sqlite3 verify command shown in the Next bead line. Do NOT run pytest on .sql files.

        **One bead at a time:** Update ONE bead to in_progress → WRITE/EDIT that file → `bd close`. Do not batch multiple beads.

        **Result (SEPARATE message, NO CMD/WRITE/EDIT lines):**
        {"outcome":"success","summary":"Implemented handlers.go and tests; go test passes"}

        **When verify fails:** First READ the failing file and the dependencies it calls. Then explain the failure in ONE sentence, then apply the fix with EDIT:/WRITE:. Do not try random edits — diagnose from the error output.

        **Web frontend (app.js, index.html):** Use plain JavaScript — no ES module imports/exports (browsers cannot load them without a bundler). Use `fetch()` + DOM APIs. No server-side function calls (InitSchema, DB.Exec) in frontend code. Match DOM IDs between index.html and app.js exactly.
      user_prompt_wrapper: none
      failure_prompt_context: [implementation_queue, implement_bead_context, phase_test_guards]
      empty_response_suffix: "Reply with EDIT:/WRITE:/READ: or CMD: lines. Implement code and unit tests per plan.md; WRITE for new *_test.go or tests/test_*.py. Use Verify from Next bead."
      prompt_context: [implementation_queue, implement_bead_context, phase_test_guards]
      pre_run: [prune_rig_root_junk, ensure_dolt_auto_commit, ensure_dolt_schema_health, sync_planning_artifacts, ensure_http_implementation_config, ensure_handler_phase_prerequisites, ensure_implement_smoke_ready, ensure_go_mod_from_spec, enforce_implement_bead_queue, prune_stale_layout_files, repair_requirements, refresh_codeindex, reconcile_implement_beads, ensure_test_stack_ready, ensure_playwright_config_ready]
      # Do not run repair_planning_beads / refresh_plan_md_if_stale per turn — they create beads and
      # rewrite plan.md mid-implementation (see pre_run sync + reconcile). Planning-only repair stays in planning state hooks.
      per_turn: [prune_stale_layout_files, repair_requirements]
      cmd_guard: implementation
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, backend_path_after_cd, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: implementation
      append_go_compile_context: true
      native_edit_tools: true
      empty_bd_list_ok: true
      auto_verify:
        - when: go_mod_tidy
          verify: go_setup
        - when: go_mod_init
          verify: go_setup
        - when: go_write_layout
          verify: go_implementation
        - when: python_test
          verify: python_implementation
        - when: python_import_check
          verify: python_implementation
        - when: python_compileall
          verify: python_implementation
      artifacts: implementation
      retry_hint_key: implementation
      failure_hint: |
        One bead at a time: bd update → **EDIT:** / **WRITE:** (include *_test.go or tests/test_*.py mapped to SPEC/plan) → verify from Next bead (go test / pytest) → bd close. Use CMD only for bd/verify. go run/curl only on cmd/server/main.go bead.
        After QA failure rework: READ the QA-cited file on disk first. If the file already exists and verify passes, bd close it — do NOT rewrite files that QA falsely claimed as missing/broken. Only make changes when QA's claim is confirmed.
    transitions:
      success:
        to: test_review
      failure:
        to: planning
      plan_gap:
        to: test_plan_rework
      architecture_failure:
        to: design
      timeout:
        to: implementation
  test_review:
    role: tester
    prompt_file: prompts/rig-flow/test_review.md
    instructions: |
      1. Read TEST_PLAN.md, SPEC.md, and architecture.md under `{{rig}}/mayor/rig/`; compare each requirement to its planned test file.
      2. Confirm every active-phase test file exists, has real assertions (not stubs), and the phase verify ({{phase_qa_verify_command}}) is green.
      3. Report success only when tests cover every requirement; failure names failing beads (polecat), plan_gap when the plan is incomplete (tester rewrites TEST_PLAN.md), architecture_failure when SPEC/architecture are the blocker (architect).
    hooks:
      max_cmd_turns: 20
      cmd_guard: test_review
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, test_plan_md_after_cd, bd_list_limit, bd_strip_beads_dir, unittest_workdir]
      env:
        pythonpath: true
        python_venv: activate
        beads_dir: true
      pip_repair_before_run: true
      python3_rewrite: true
      track: test_review
      artifacts: test_review
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Read TEST_PLAN.md and the test files it names from {{rig}}/mayor/rig; run {{phase_qa_verify_command}}.
        Allowed outcomes: success, failure, plan_gap, architecture_failure.
      failure_hint: |
        Do not edit source or tests. If a test file is missing, weak, or verify fails, report failure with the bead IDs and test paths. If TEST_PLAN.md itself is incomplete, use plan_gap. If SPEC/architecture contradict the tests, use architecture_failure.
    transitions:
      success:
        to: qa_review
      failure:
        to: implementation
      plan_gap:
        to: test_plan_rework
      architecture_failure:
        to: design
      timeout:
        to: implementation
  qa_review:
    role: qa
    prompt_file: prompts/rig-flow/qa_review.md
    instructions: |
      1. Review closed implementation beads in `{{rig}}` against SPEC.md and architecture.md (static `src`/`href` in web/index.html must match the architecture HTTP table — {{static_url_contract_short}}).
      2. Runtime smoke only when SPEC/architecture define HTTP routes or static web+server (see qa_runtime_smoke_block). Skip go run/curl for library-only or API-less profiles. Python rigs use pytest from layout_root/backend — not Go cmd/server paths.
      3. Use outcome task_passed (more work), all_passed (done), or failure (rework).
    hooks:
      state_timeout_seconds: 1800
      cmd_timeout_seconds: 900
      append_go_compile_context: true
      max_cmd_turns: 8
      pre_run: [ensure_dolt_auto_commit, ensure_dolt_schema_health, reconcile_implement_beads]
      per_turn: [repair_requirements]
      cmd_guard: qa
      cmd_rewrites: [rig_placeholders, unwrap_bash_lc, bd_list_implement_scope, unittest_workdir, bd_list_limit, bd_close_auto_commit, bd_strip_beads_dir]
      env:
        pythonpath: true
        python_venv: activate
      pip_repair_before_run: true
      python3_rewrite: true
      track: qa
      artifacts: qa
      bead_ids_in_summary: true
      retry_hint: |
        One CMD: per line. Review closed beads against SPEC and architecture; use allowed QA outcomes only.
      failure_hint: |
        Run real CMD: lines: bd list --status=closed, head SPEC.md, {{unittest_command_hint}} from {{rig}}/mayor/rig. Web+server rigs: `go run ./cmd/server` (gt-agent adds curls from architecture + index.html — do not sed HTML to guess static URLs). If smoke or verify fails, do **not** repeat the same go run+curl — reply next turn with JSON only: {"outcome":"failure","summary":"..."} naming HTTP status, routes, and bd bead IDs from list output.
    transitions:
      task_passed:
        to: implementation
      all_passed:
        to: advance_phase
      failure:
        to: implementation
      architecture_failure:
        to: design
      timeout:
        to: implementation
  advance_phase:
    role: ""
    prompt_file: ""
    instructions: "Internal: orchestrator advances delivery phase and reroutes to planning or completed."
    hooks:
      state_timeout_seconds: 86400
    transitions:
      timeout:
        to: planning
